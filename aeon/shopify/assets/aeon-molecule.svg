<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NAD+ molecular structure">
  <defs>
    <radialGradient id="molGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bf0c4" stop-opacity="0.22"/><stop offset="1" stop-color="#2bf0c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="130" cy="130" r="120" fill="url(#molGlow)"/>
  <g fill="none" stroke="#2bf0c4" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- left ring (nicotinamide) -->
    <polygon points="62,108 84,96 106,108 106,134 84,146 62,134"/>
    <!-- right ring (adenine, bicyclic feel) -->
    <polygon points="156,120 178,108 200,120 200,146 178,158 156,146"/>
    <polyline points="200,133 220,126 220,140 200,147"/>
    <!-- ribose / phosphate backbone -->
    <polyline points="106,121 130,134 156,133"/>
    <circle cx="130" cy="134" r="9"/>
    <!-- bonds -->
    <line x1="84" y1="146" x2="84" y2="170"/>
    <line x1="178" y1="158" x2="178" y2="182"/>
  </g>
  <g fill="#c9ff4d">
    <circle cx="84" cy="170" r="4.5"/>
    <circle cx="178" cy="182" r="4.5"/>
  </g>
  <g fill="#2bf0c4">
    <circle cx="62" cy="108" r="3.6"/><circle cx="106" cy="108" r="3.6"/>
    <circle cx="200" cy="120" r="3.6"/><circle cx="220" cy="126" r="3.6"/>
    <circle cx="130" cy="134" r="3.2"/>
  </g>
  <text x="130" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3" fill="#5a6376">NAD⁺</text>
</svg>
