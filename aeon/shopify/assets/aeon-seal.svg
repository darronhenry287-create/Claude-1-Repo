<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Third-party tested lab seal">
  <defs>
    <radialGradient id="sealGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bf0c4" stop-opacity="0.18"/><stop offset="1" stop-color="#2bf0c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="130" cy="130" r="120" fill="url(#sealGlow)"/>
  <circle cx="130" cy="130" r="92" fill="none" stroke="rgba(43,240,196,0.5)" stroke-width="1.5"/>
  <circle cx="130" cy="130" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 6"/>
  <!-- circular text via path -->
  <path id="arcTop" d="M 60 130 A 70 70 0 0 1 200 130" fill="none"/>
  <path id="arcBot" d="M 200 130 A 70 70 0 0 1 60 130" fill="none"/>
  <text font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="4" fill="#99a2b4">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">THIRD-PARTY TESTED</textPath>
  </text>
  <text font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3" fill="#5a6376">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">PURITY ≥ 99% · COA</textPath>
  </text>
  <!-- check -->
  <g transform="translate(130 132)">
    <circle r="34" fill="none" stroke="#2bf0c4" stroke-width="2.5"/>
    <path d="M -15 2 L -4 14 L 17 -12" fill="none" stroke="#2bf0c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
