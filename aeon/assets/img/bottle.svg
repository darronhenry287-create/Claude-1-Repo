<svg viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AEON NMN supplement bottle">
  <defs>
    <linearGradient id="bGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f1f5fb"/>
      <stop offset="1" stop-color="#e3e9f3"/>
    </linearGradient>
    <linearGradient id="bCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde4ef"/>
      <stop offset="1" stop-color="#c4cedd"/>
    </linearGradient>
    <linearGradient id="bMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bff"/>
      <stop offset="1" stop-color="#2546c8"/>
    </linearGradient>
  </defs>

  <!-- cap -->
  <rect x="86" y="14" width="88" height="40" rx="7" fill="url(#bCap)" stroke="#b6c1d4" stroke-width="1"/>
  <line x1="98" y1="22" x2="98" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="110" y1="22" x2="110" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="150" y1="22" x2="150" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="162" y1="22" x2="162" y2="46" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- neck -->
  <rect x="96" y="50" width="68" height="14" fill="#dbe2ee"/>

  <!-- body -->
  <rect x="62" y="60" width="136" height="266" rx="20" fill="url(#bGlass)" stroke="#cdd6e4" stroke-width="1.5"/>
  <rect x="70" y="68" width="12" height="250" rx="6" fill="#ffffff" opacity="0.8"/>

  <!-- label -->
  <rect x="78" y="104" width="104" height="186" rx="10" fill="#ffffff" stroke="rgba(47,91,255,0.5)" stroke-width="1.3"/>

  <!-- wordmark -->
  <text x="130" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="17" font-weight="800" letter-spacing="2.5" fill="#0e1116">AEON</text>
  <line x1="92" y1="142" x2="168" y2="142" stroke="rgba(14,17,22,0.10)" stroke-width="1"/>

  <!-- hex molecule motif -->
  <g transform="translate(130 178)" stroke="url(#bMint)" stroke-width="2" fill="none" stroke-linejoin="round">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
    <circle cx="0" cy="-22" r="3.2" fill="#2f5bff" stroke="none"/>
    <circle cx="19" cy="11" r="3.2" fill="#2f5bff" stroke="none"/>
    <circle cx="-19" cy="11" r="3.2" fill="#2f5bff" stroke="none"/>
  </g>

  <!-- NMN -->
  <text x="130" y="232" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="#2f5bff">NMN</text>
  <text x="130" y="250" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7" letter-spacing="1" fill="#56607a">β-NICOTINAMIDE MONONUCLEOTIDE</text>

  <!-- dose pill -->
  <rect x="92" y="262" width="76" height="18" rx="9" fill="rgba(47,91,255,0.08)" stroke="rgba(47,91,255,0.35)" stroke-width="1"/>
  <text x="130" y="274" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#2f5bff">1000MG · 120 CAPS</text>

  <!-- base -->
  <rect x="62" y="316" width="136" height="10" rx="5" fill="#dbe2ee"/>
</svg>
