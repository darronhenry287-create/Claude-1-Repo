<svg viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AEON NMN supplement bottle">
  <defs>
    <linearGradient id="bGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="0.5" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a323d"/>
      <stop offset="1" stop-color="#181d25"/>
    </linearGradient>
    <linearGradient id="bShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bf0c4"/>
      <stop offset="1" stop-color="#14b896"/>
    </linearGradient>
  </defs>

  <!-- cap -->
  <rect x="86" y="14" width="88" height="40" rx="7" fill="url(#bCap)" stroke="#3a434f" stroke-width="1"/>
  <line x1="98" y1="22" x2="98" y2="46" stroke="#0e1116" stroke-width="2" opacity="0.6"/>
  <line x1="110" y1="22" x2="110" y2="46" stroke="#0e1116" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="22" x2="150" y2="46" stroke="#0e1116" stroke-width="2" opacity="0.6"/>
  <line x1="162" y1="22" x2="162" y2="46" stroke="#0e1116" stroke-width="2" opacity="0.6"/>

  <!-- neck -->
  <rect x="96" y="50" width="68" height="14" fill="#1b212a"/>

  <!-- body -->
  <rect x="62" y="60" width="136" height="266" rx="20" fill="url(#bGlass)" stroke="#39424e" stroke-width="1.5"/>
  <rect x="70" y="68" width="14" height="250" rx="7" fill="url(#bShine)"/>

  <!-- label -->
  <rect x="78" y="104" width="104" height="186" rx="10" fill="#0b0e13" stroke="rgba(43,240,196,0.45)" stroke-width="1.2"/>

  <!-- wordmark -->
  <text x="130" y="132" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#eef1f7">AEON</text>
  <line x1="92" y1="142" x2="168" y2="142" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- hex molecule motif -->
  <g transform="translate(130 178)" stroke="url(#bMint)" stroke-width="2" fill="none" stroke-linejoin="round">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
    <circle cx="0" cy="-22" r="3.2" fill="#2bf0c4" stroke="none"/>
    <circle cx="19" cy="11" r="3.2" fill="#2bf0c4" stroke="none"/>
    <circle cx="-19" cy="11" r="3.2" fill="#2bf0c4" stroke="none"/>
  </g>

  <!-- NMN -->
  <text x="130" y="232" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="#2bf0c4">NMN</text>
  <text x="130" y="250" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.2" letter-spacing="1.5" fill="#99a2b4">β-NICOTINAMIDE MONONUCLEOTIDE</text>

  <!-- dose pill -->
  <rect x="92" y="262" width="76" height="18" rx="9" fill="rgba(43,240,196,0.08)" stroke="rgba(43,240,196,0.4)" stroke-width="1"/>
  <text x="130" y="274" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" fill="#2bf0c4">1000MG · 120 CAPS</text>

  <!-- base shadow line -->
  <rect x="62" y="316" width="136" height="10" rx="5" fill="#0a0d11"/>
</svg>
