<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What is inside a FORM gummy">
  <rect width="400" height="400" fill="#14233f"/>
  <circle cx="200" cy="200" r="135" fill="#1e3252"/>
  <circle cx="200" cy="200" r="92" fill="#33507a" opacity="0.5"/>
  <!-- single hero gummy -->
  <rect x="150" y="150" width="100" height="88" rx="26" fill="#9d3b6b"/>
  <rect x="168" y="164" width="34" height="20" rx="10" fill="#c75f93" opacity="0.85"/>
  <text x="200" y="205" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">5g</text>
  <!-- callout dots + lines -->
  <g stroke="#dbe6f5" stroke-width="1.5" opacity="0.8">
    <line x1="150" y1="172" x2="92" y2="120"/>
    <line x1="250" y1="172" x2="308" y2="120"/>
    <line x1="150" y1="216" x2="92" y2="270"/>
    <line x1="250" y1="216" x2="308" y2="270"/>
  </g>
  <g fill="#ff6a3d"><circle cx="92" cy="120" r="6"/><circle cx="308" cy="120" r="6"/><circle cx="92" cy="270" r="6"/><circle cx="308" cy="270" r="6"/></g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#dbe6f5">
    <text x="80" y="108" text-anchor="end">Creatine monohydrate</text>
    <text x="320" y="108" text-anchor="start">Just 2g sugar</text>
    <text x="80" y="288" text-anchor="end">Pectin · vegan</text>
    <text x="320" y="288" text-anchor="start">No artificial dyes</text>
  </g>
  <text x="200" y="346" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dbe6f5" opacity="0.8" font-style="italic">Four gummies. Everything they need.</text>
</svg>
