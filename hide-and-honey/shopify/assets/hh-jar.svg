<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="The Tallow Balm jar">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1f0a"/><stop offset="0.5" stop-color="#5e3411"/><stop offset="1" stop-color="#2c1707"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241204"/><stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="360" rx="120" ry="20" fill="#2c2114" opacity="0.18"/>
  <!-- balm -->
  <ellipse cx="200" cy="120" rx="86" ry="22" fill="#f4ead4"/>
  <path d="M150 120c8-14 22-22 50-22s42 8 50 22" fill="#fbf4e3"/>
  <!-- jar body -->
  <path d="M118 130c0-8 14-12 82-12s82 4 82 12v170c0 14-26 22-82 22s-82-8-82-22Z" fill="url(#glass)"/>
  <!-- rim -->
  <path d="M118 132c0 12 26 18 82 18s82-6 82-18" fill="none" stroke="#1c0f04" stroke-width="3"/>
  <!-- label -->
  <rect x="132" y="168" width="136" height="118" rx="8" fill="#161310"/>
  <text x="200" y="210" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#d99323">TALLOW</text>
  <text x="200" y="232" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="19" fill="#d99323">BALM</text>
  <line x1="160" y1="244" x2="240" y2="244" stroke="#6f5a2a" stroke-width="1.5"/>
  <text x="200" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" letter-spacing="1" fill="#cbb884">4 INGREDIENTS. NOTHING ELSE.</text>
  <rect x="172" y="270" width="56" height="13" rx="6.5" fill="#d99323"/>
  <text x="200" y="279.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#161310">UNSCENTED</text>
  <!-- highlight -->
  <path d="M140 150c-4 50-4 110 2 150" stroke="#7a4a1c" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
</svg>
